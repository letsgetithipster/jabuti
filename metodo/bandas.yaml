        caps: {ativo: 10, setor: 25}
      equilibrada:
        bandas: {rf-br: [20, 30, 40], caixa: [0, 5, 15], acoes-br: [10, 20, 30], fiis: [0, 10, 20], rv-int: [15, 25, 35], reits-us: [0, 5, 15], cripto: [0, 0, 0], commodities: [0, 5, 15]}
        caps: {ativo: 10, setor: 25}
      agressiva:
        bandas: {rf-br: [10, 20, 30], caixa: [0, 5, 15], acoes-br: [15, 25, 35], fiis: [0, 5, 15], rv-int: [25, 35, 45], reits-us: [0, 5, 15], cripto: [0, 0, 0], commodities: [0, 5, 15]}
