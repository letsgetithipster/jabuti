# jabuti — configuração do workspace. Editável pelo usuário.
versao: 1
idioma: pt-BR
moeda_base: BRL
harness: [claude-code]        # alvos de compilação: claude-code hoje; codex, cursor, app-web reservados
casa:
  nome: __CASA__              # como você chama a sua casa de gestão; aparece no CLAUDE.md gerado
usuario:
  nome: __USUARIO__           # como o coordenador se dirige a você
coordenador:
  nome: Otávio                # o gestor que fala com você; troque se quiser
cotacoes:
  provider: manual            # manual | yahoo | brapi (brapi lê o token de BRAPI_TOKEN e cobre SÓ a B3 em BRL: com ativo internacional, use yahoo)
  cambio: bcb-sgs             # bcb-sgs | yahoo | manual — usado quando há posição fora do BRL
contas:
  - id: corretora-br
    nome: "Minha corretora"
    moeda: BRL                # moeda de TODAS as linhas dessa conta em fills/proventos
    blocos: []                # propósito: quais blocos esta conta serve (vazio = qualquer); o /jabuti-importar preenche
caminhos:
  motor: __MOTOR__            # preenchido pelo criar_workspace.py; NÃO editar à mão
  planilhas: planilhas        # onde o cockpit xlsx é gerado (relativo à raiz, ou absoluto, ex. OneDrive)
