# jabuti — configuração do workspace. Editável pelo usuário.
versao: 1
idioma: pt-BR
moeda_base: BRL
harness: [claude-code]        # o seu agente: claude-code recebe harness compilado; codex, cursor e app-web leem AGENTS.md do motor
casa:
  nome: __CASA__              # como você chama a sua casa de gestão; aparece nas instruções geradas para o seu agente
usuario:
  nome: __USUARIO__           # como o coordenador se dirige a você
coordenador:
  nome: Otávio                # o gestor que fala com você; troque se quiser
cotacoes:
  provider: yahoo             # yahoo (default: sem token, sem cadastro) | brapi (lê o token de BRAPI_TOKEN e cobre SÓ a B3 em BRL) | manual (nada sai pela rede: você cola os preços com --manual TICKER=PRECO)
  cambio: bcb-sgs             # bcb-sgs | yahoo | manual — usado quando há posição fora do BRL
contas:
  - id: corretora-br
    nome: "Minha corretora"
    moeda: BRL                # moeda de TODAS as linhas dessa conta em fills/proventos
    blocos: []                # propósito: quais blocos esta conta serve (vazio = qualquer); o /jabuti-importar preenche
caminhos:
  motor: __MOTOR__            # preenchido pelo criar_workspace.py; NÃO editar à mão
  planilhas: planilhas        # onde o cockpit xlsx é gerado (relativo à raiz, ou absoluto, ex. OneDrive)
privacidade:
  remoto-declarado: null      # URL do SEU remoto git, se você versionar este workspace num repositório PRIVADO. Leia PRIVACIDADE.md antes de criar um.
